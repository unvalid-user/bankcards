components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "404 NOT_FOUND"
        message:
          type: string
          example: "User not found"
    CreateUserRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          example: "89991234455"
        password:
          type: string
          maxLength: 20
          minLength: 8
          example: "cool-password"
        role:
          type: string
          enum:
            - ROLE_USER
            - ROLE_ADMIN
      required:
        - password
        - phoneNumber
        - role
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        phoneNumber:
          type: string
          example: "89991234455"
        role:
          type: string
          example: "ROLE_ADMIN"
    CreateTransactionRequest:
      type: object
      properties:
        sourceCardId:
          type: integer
          format: int64
          example: 1
        destinationCardId:
          type: integer
          format: int64
          example: 2
        monetaryAmount:
          type: number
          example: 100.55
      required:
        - destinationCardId
        - monetaryAmount
        - sourceCardId
    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 1
        sourceCardId:
          type: integer
          format: int64
          example: 1
        destinationCardId:
          type: integer
          format: int64
          example: 2
        monetaryAmount:
          type: number
          example: 100.55
    CreateCardRequest:
      type: object
      properties:
        cardNumber:
          type: string
          example: 1234567812345678
        ownerPhoneNumber:
          type: string
          example: 89991234455
        expirationDate:
          type: string
          format: date
      required:
        - cardNumber
        - expirationDate
        - ownerPhoneNumber
    CardResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        maskedNumber:
          type: string
        userId:
          type: integer
          format: int64
        expirationDate:
          type: string
          format: date
        status:
          type: string
        balance:
          type: number
    CardOperationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        status:
          type: string
    LoginRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          example: "admin"
        password:
          type: string
          example: "admin"
      required:
        - password
        - phoneNumber
